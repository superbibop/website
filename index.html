<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atlas — Homework &amp; Deadlines</title>
<meta name="description" content="Atlas tracks your homework, syncs assignments from ManageBac, and sends native desktop notifications before every deadline." />
<meta name="theme-color" content="#07090C" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Paint the dark ground before Tailwind loads, so there is never a white flash. -->
<style>html,body{background:#07090C;color:#cbd5e1}</style>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:   { 950:'#07090C', 900:'#0B0E13', 850:'#0F131A', 800:'#141922', 750:'#1A202A', 700:'#232B36', 600:'#2E3743' },
          atlas: { 200:'#BEF3E7', 300:'#8FE3D0', 400:'#5FD3BC', 500:'#38BFA7', 600:'#2A9A88' },
          haze:  { 300:'#B4C0D0', 400:'#8B98AA', 500:'#6B7788' }
        },
        fontFamily: {
          sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif']
        },
        boxShadow: {
          card:  '0 1px 0 0 rgba(255,255,255,0.04) inset, 0 18px 40px -24px rgba(0,0,0,0.9)',
          glow:  '0 0 0 1px rgba(95,211,188,0.22), 0 0 34px -10px rgba(95,211,188,0.35)',
          alert: '0 0 0 1px rgba(251,113,133,0.22), 0 0 34px -12px rgba(251,113,133,0.32)'
        },
        keyframes: {
          rise:  { '0%':{opacity:'0',transform:'translateY(6px)'}, '100%':{opacity:'1',transform:'translateY(0)'} },
          pulseRing: { '0%,100%':{opacity:'0.55'}, '50%':{opacity:'1'} }
        },
        animation: {
          rise: 'rise .28s cubic-bezier(.2,.7,.3,1) both',
          pulseRing: 'pulseRing 2.4s ease-in-out infinite'
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="assets/styles.css" />
</head>

<body class="bg-ink-950 text-slate-200 font-sans antialiased selection:bg-atlas-500/30">

<div class="min-h-screen flex flex-col lg:flex-row">

  <!-- ============================ SIDEBAR ============================ -->
  <aside class="hidden lg:flex lg:flex-col lg:w-64 xl:w-72 shrink-0 border-r border-white/5 bg-ink-900/70 backdrop-blur lg:h-screen lg:sticky lg:top-0">
    <div class="px-6 py-6 flex items-center gap-3">
      <div class="relative">
        <div class="absolute inset-0 rounded-xl bg-atlas-500/25 blur-md animate-pulseRing"></div>
        <div class="relative h-10 w-10 rounded-xl bg-ink-800 ring-1 ring-white/10 grid place-items-center">
          <svg viewBox="0 0 24 24" class="h-5 w-5 text-atlas-400" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.2"/><path d="M3.8 12h16.4"/><path d="M12 3.8c2.4 2.5 3.6 5.3 3.6 8.2s-1.2 5.7-3.6 8.2c-2.4-2.5-3.6-5.3-3.6-8.2S9.6 6.3 12 3.8z"/>
          </svg>
        </div>
      </div>
      <div>
        <h1 class="text-[15px] font-semibold tracking-tight text-slate-100">Atlas</h1>
        <p class="text-[11px] text-haze-500 -mt-0.5">Homework &amp; deadlines</p>
      </div>
    </div>

    <nav id="sideNav" class="px-3 space-y-1 flex-1 overflow-y-auto"></nav>

    <div class="p-3 space-y-2 border-t border-white/5">
      <div class="rounded-xl bg-ink-850 ring-1 ring-white/[0.06] p-3.5">
        <div class="flex items-center gap-2 mb-2.5">
          <span id="mbDot" class="h-1.5 w-1.5 rounded-full bg-haze-500"></span>
          <span class="text-[11px] font-medium uppercase tracking-[0.13em] text-haze-500">ManageBac</span>
        </div>
        <p id="mbStatus" class="text-[12px] text-haze-400 leading-snug mb-3">Not synced yet</p>
        <button data-act="sync" class="w-full h-9 rounded-lg bg-atlas-500/10 text-atlas-300 ring-1 ring-atlas-500/25 hover:bg-atlas-500/20 hover:ring-atlas-500/40 transition text-[13px] font-medium inline-flex items-center justify-center gap-2">
          <svg data-sync-icon viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
          Sync now
        </button>
      </div>

      <button data-act="enable-notifications" id="notifPanel" class="w-full text-left rounded-xl bg-ink-850 ring-1 ring-white/[0.06] p-3.5 hover:ring-white/15 transition">
        <div class="flex items-center gap-2 mb-1.5">
          <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 text-haze-400" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="text-[11px] font-medium uppercase tracking-[0.13em] text-haze-500">Notifications</span>
        </div>
        <p id="notifStatus" class="text-[12px] text-haze-400 leading-snug">Checking…</p>
      </button>

      <button data-act="settings" class="w-full h-9 rounded-lg text-haze-400 hover:text-slate-200 hover:bg-white/[0.04] transition text-[13px] inline-flex items-center justify-center gap-2">
        <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10.5 4.6V4.4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- ============================= MAIN ============================= -->
  <main class="flex-1 min-w-0 flex flex-col">

    <header class="sticky top-0 z-30 border-b border-white/5 bg-ink-950/85 backdrop-blur-xl">
      <div class="px-4 sm:px-6 lg:px-8 py-3.5 flex items-center gap-3">

        <div class="lg:hidden flex items-center gap-2.5 mr-1">
          <div class="h-8 w-8 rounded-lg bg-ink-800 ring-1 ring-white/10 grid place-items-center">
            <svg viewBox="0 0 24 24" class="h-4 w-4 text-atlas-400" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.2"/><path d="M3.8 12h16.4"/><path d="M12 3.8c2.4 2.5 3.6 5.3 3.6 8.2s-1.2 5.7-3.6 8.2c-2.4-2.5-3.6-5.3-3.6-8.2S9.6 6.3 12 3.8z"/></svg>
          </div>
          <span class="font-semibold tracking-tight text-slate-100">Atlas</span>
        </div>

        <label class="relative flex-1 max-w-md hidden sm:block">
          <svg viewBox="0 0 24 24" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-haze-500 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search assignments or classes…" autocomplete="off"
            class="w-full h-9 pl-9 pr-3 rounded-lg bg-ink-850 ring-1 ring-white/[0.06] focus:ring-atlas-500/40 focus:bg-ink-800 outline-none text-[13px] placeholder:text-haze-500 transition" />
        </label>

        <div class="flex-1 sm:hidden"></div>

        <button data-act="sync" class="lg:hidden h-9 w-9 rounded-lg bg-ink-850 ring-1 ring-white/[0.06] grid place-items-center text-haze-300 hover:text-atlas-300 transition" title="Sync ManageBac">
          <svg data-sync-icon viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
        </button>

        <button data-act="import" class="hidden sm:inline-flex h-9 px-3 rounded-lg bg-ink-850 ring-1 ring-white/[0.06] hover:ring-white/15 items-center gap-2 text-[13px] text-haze-300 hover:text-slate-100 transition">
          <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
          Import
        </button>

        <button data-act="new" class="h-9 px-3.5 rounded-lg bg-atlas-500 text-ink-950 font-semibold text-[13px] inline-flex items-center gap-1.5 hover:bg-atlas-400 shadow-[0_6px_20px_-8px_rgba(95,211,188,.8)] transition">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="hidden sm:inline">New</span>
        </button>

        <button data-act="settings" class="lg:hidden h-9 w-9 rounded-lg bg-ink-850 ring-1 ring-white/[0.06] grid place-items-center text-haze-300 transition" title="Settings">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10.5 4.6V4.4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="px-4 sm:px-6 lg:px-8 py-6 space-y-6 w-full max-w-[1400px]">

      <!-- ===== NEW FROM MANAGEBAC ===== -->
      <section id="mbNewSection" class="hidden"></section>

      <!-- ===== STATS ===== -->
      <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></section>

      <!-- ===== CONTROLS ===== -->
      <section class="flex flex-wrap items-center gap-2">
        <div id="filterChips" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar -mx-1 px-1 py-0.5"></div>
        <div class="flex-1"></div>
        <div class="flex items-center gap-1 rounded-lg bg-ink-850 ring-1 ring-white/[0.06] p-1">
          <button data-view="list" class="view-btn h-7 px-2.5 rounded-md text-[12px] font-medium inline-flex items-center gap-1.5 transition">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
            List
          </button>
          <button data-view="calendar" class="view-btn h-7 px-2.5 rounded-md text-[12px] font-medium inline-flex items-center gap-1.5 transition">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            Calendar
          </button>
        </div>
      </section>

      <!-- ===== VIEWS ===== -->
      <section id="listView" class="space-y-7"></section>
      <section id="calendarView" class="hidden"></section>

    </div>
  </main>
</div>

<!-- ============================ MODALS ============================ -->

<dialog id="dlgEdit" class="atlas-dialog">
  <form id="formEdit" class="w-[min(94vw,540px)] rounded-2xl bg-ink-900 ring-1 ring-white/10 shadow-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-white/5 flex items-center justify-between">
      <h2 id="editTitle" class="text-[15px] font-semibold text-slate-100">New assignment</h2>
      <button type="button" data-close class="h-7 w-7 rounded-md grid place-items-center text-haze-500 hover:text-slate-200 hover:bg-white/5">&#10005;</button>
    </div>
    <div class="px-5 py-4 space-y-3.5 max-h-[65vh] overflow-y-auto">
      <div>
        <label class="atlas-label">Title</label>
        <input name="title" required maxlength="140" class="atlas-input" placeholder="Chapter 7 problem set" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="atlas-label">Class</label>
          <input name="course" list="courseList" required maxlength="80" class="atlas-input" placeholder="Biology HL" />
          <datalist id="courseList"></datalist>
        </div>
        <div>
          <label class="atlas-label">Type</label>
          <select name="type" class="atlas-input">
            <option value="homework">Homework</option>
            <option value="assessment">Assessment</option>
            <option value="project">Project</option>
            <option value="reading">Reading</option>
            <option value="lab">Lab</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="atlas-label">Due date</label>
          <input name="dueDate" type="date" required class="atlas-input" />
        </div>
        <div>
          <label class="atlas-label">Due time</label>
          <input name="dueTime" type="time" value="23:59" required class="atlas-input" />
        </div>
      </div>
      <div>
        <label class="atlas-label">Notes <span class="text-haze-500 font-normal">(optional)</span></label>
        <textarea name="description" rows="3" maxlength="600" class="atlas-input resize-none" placeholder="Pages 210-214, show all working."></textarea>
      </div>
    </div>
    <div class="px-5 py-3.5 border-t border-white/5 flex items-center gap-2">
      <button type="button" data-act="delete-current" id="btnDelete" class="hidden h-9 px-3 rounded-lg text-[13px] text-rose-300/80 hover:text-rose-200 hover:bg-rose-500/10 transition">Delete</button>
      <div class="flex-1"></div>
      <button type="button" data-close class="h-9 px-3.5 rounded-lg text-[13px] text-haze-300 hover:text-slate-100 hover:bg-white/5 transition">Cancel</button>
      <button type="submit" class="h-9 px-4 rounded-lg bg-atlas-500 text-ink-950 font-semibold text-[13px] hover:bg-atlas-400 transition">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dlgImport" class="atlas-dialog">
  <div class="w-[min(94vw,620px)] rounded-2xl bg-ink-900 ring-1 ring-white/10 shadow-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-white/5 flex items-center justify-between">
      <div>
        <h2 class="text-[15px] font-semibold text-slate-100">Import ManageBac feed</h2>
        <p class="text-[12px] text-haze-500 mt-0.5">Paste an export, or choose a <code class="text-atlas-300/80">.json</code> file.</p>
      </div>
      <button type="button" data-close class="h-7 w-7 rounded-md grid place-items-center text-haze-500 hover:text-slate-200 hover:bg-white/5">&#10005;</button>
    </div>
    <div class="px-5 py-4 space-y-3">
      <div class="flex flex-wrap items-center gap-2">
        <button data-act="pick-file" class="h-8 px-3 rounded-lg bg-ink-800 ring-1 ring-white/10 text-[12.5px] text-haze-200 hover:ring-white/20 transition">Choose file…</button>
        <button data-act="load-sample" class="h-8 px-3 rounded-lg bg-ink-800 ring-1 ring-white/10 text-[12.5px] text-haze-200 hover:ring-white/20 transition">Load sample shape</button>
        <input type="file" id="fileInput" accept=".json,application/json" class="hidden" />
      </div>
      <textarea id="importText" rows="12" spellcheck="false" placeholder='[{"id":"mb_1001","title":"...","class":{"name":"Biology HL"},"due_at":"2026-08-22T23:59:00Z"}]'
        class="atlas-input font-mono text-[12px] leading-relaxed resize-none"></textarea>
      <p id="importMsg" class="text-[12px] text-haze-500 min-h-[18px]"></p>
    </div>
    <div class="px-5 py-3.5 border-t border-white/5 flex justify-end gap-2">
      <button type="button" data-close class="h-9 px-3.5 rounded-lg text-[13px] text-haze-300 hover:text-slate-100 hover:bg-white/5 transition">Cancel</button>
      <button data-act="do-import" class="h-9 px-4 rounded-lg bg-atlas-500 text-ink-950 font-semibold text-[13px] hover:bg-atlas-400 transition">Import</button>
    </div>
  </div>
</dialog>

<dialog id="dlgSettings" class="atlas-dialog">
  <div class="w-[min(94vw,560px)] rounded-2xl bg-ink-900 ring-1 ring-white/10 shadow-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-white/5 flex items-center justify-between">
      <h2 class="text-[15px] font-semibold text-slate-100">Settings</h2>
      <button type="button" data-close class="h-7 w-7 rounded-md grid place-items-center text-haze-500 hover:text-slate-200 hover:bg-white/5">&#10005;</button>
    </div>
    <div id="settingsBody" class="px-5 py-4 space-y-5 max-h-[70vh] overflow-y-auto"></div>
    <div class="px-5 py-3.5 border-t border-white/5 flex justify-between gap-2">
      <button data-act="reset-data" class="h-9 px-3 rounded-lg text-[13px] text-rose-300/80 hover:text-rose-200 hover:bg-rose-500/10 transition">Reset all data</button>
      <button type="button" data-close class="h-9 px-4 rounded-lg bg-atlas-500 text-ink-950 font-semibold text-[13px] hover:bg-atlas-400 transition">Done</button>
    </div>
  </div>
</dialog>

<div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end pointer-events-none"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/managebac.js"></script>
<script src="js/notify.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
